<!doctype html>
<html lang="en">
  <head>
    <meta charset="utf-8" />
    <title>Save the Date social artwork source</title>
    <style>
      @font-face {
        font-family: Manrope;
        src: url("../src/assets/fonts/manrope-400-600-latin.woff2") format("woff2");
        font-style: normal;
        font-weight: 400 600;
      }

      * {
        box-sizing: border-box;
      }

      html,
      body {
        width: 1200px;
        height: 630px;
        margin: 0;
        overflow: hidden;
      }

      body {
        background: #0d2522;
      }

      .artwork {
        position: relative;
        width: 1200px;
        height: 630px;
        isolation: isolate;
        overflow: hidden;
        background: #18352f;
        color: #f6f2ea;
        font-family: Manrope, sans-serif;
        text-align: center;
      }

      .panel {
        position: absolute;
        top: 0;
        bottom: 0;
        width: 50%;
      }

      .panel--left {
        left: 0;
        background:
          radial-gradient(ellipse 80% 110% at 86% 46%, #35524a 0%, transparent 78%),
          linear-gradient(115deg, #18342e 0%, #213e37 65%, #29463e 100%);
      }

      .panel--right {
        right: 0;
        background:
          radial-gradient(ellipse 80% 100% at 13% 44%, #334d44 0%, transparent 80%),
          linear-gradient(245deg, #142d29 0%, #1a3630 64%, #244138 100%);
      }

      .panel--left::before,
      .panel--right::before {
        position: absolute;
        inset: 0;
        content: "";
        background: linear-gradient(
          180deg,
          rgb(245 249 239 / 4%),
          transparent 42%,
          rgb(3 12 10 / 8%)
        );
      }

      .panel--left::after,
      .panel--right::after {
        position: absolute;
        inset: 0;
        content: "";
        border: 1px solid rgb(232 241 229 / 5%);
      }

      .seam {
        position: absolute;
        z-index: 1;
        top: 0;
        bottom: 0;
        left: 599px;
        width: 3px;
        background: linear-gradient(
          90deg,
          rgb(3 20 16 / 43%),
          rgb(10 32 27 / 15%) 55%,
          rgb(215 231 218 / 12%)
        );
        box-shadow:
          -2px 0 9px rgb(1 13 10 / 13%),
          1px 0 8px rgb(188 213 192 / 5%);
      }

      .grain {
        position: absolute;
        z-index: 2;
        inset: 0;
        width: 100%;
        height: 100%;
        opacity: 0.09;
        pointer-events: none;
        mix-blend-mode: soft-light;
      }

      .content {
        position: absolute;
        z-index: 3;
        inset: 0;
        display: flex;
        flex-direction: column;
        align-items: center;
      }

      .seal {
        display: block;
        width: 152px;
        height: 152px;
        margin-top: 76px;
        border-radius: 50%;
        box-shadow:
          0 11px 21px rgb(2 15 11 / 24%),
          0 2px 5px rgb(2 15 11 / 15%);
      }

      .names {
        margin-top: 38px;
        font-size: 84px;
        font-weight: 600;
        letter-spacing: -0.055em;
        line-height: 1.04;
        text-shadow: 0 2px 12px rgb(3 15 12 / 16%);
      }

      .names span {
        display: block;
        white-space: nowrap;
      }

      .amp {
        display: inline !important;
        font-weight: 400;
        color: #e1e8dd;
      }

      .subtitle {
        margin-top: 34px;
        font-size: 46px;
        font-weight: 400;
        letter-spacing: -0.025em;
        line-height: 1.15;
        white-space: nowrap;
        color: #e8eee4;
        text-shadow: 0 2px 10px rgb(3 15 12 / 15%);
      }
    </style>
  </head>
  <body>
    <main class="artwork" aria-label="Emily and Lawrence Save the Date artwork">
      <div class="panel panel--left"></div>
      <div class="panel panel--right"></div>
      <div class="seam"></div>
      <svg class="grain" aria-hidden="true">
        <filter id="frost" x="0" y="0" width="100%" height="100%">
          <feTurbulence type="fractalNoise" baseFrequency="0.34" numOctaves="2" seed="27" />
          <feColorMatrix type="saturate" values="0" />
        </filter>
        <rect width="1200" height="630" filter="url(#frost)" />
      </svg>
      <div class="content">
        <!-- The existing site asset contains the actual Pavilion-derived mark. -->
        <img class="seal" src="../public/favicon.svg" alt="" />
        <div class="names" aria-label="Emily &amp; Lawrence">
          <span>Emily</span>
          <span><span class="amp">&amp;</span> Lawrence</span>
        </div>
        <div class="subtitle">Save the Date</div>
      </div>
    </main>
  </body>
</html>
