name: Deploy to GitHub Pages

on:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: pages
  cancel-in-progress: false

jobs:
  build:
    runs-on: ubuntu-latest
    env:
      # GitHub Pages serves this project under /WedSite2027/. Other hosts build at the root.
      BASE_PATH: /WedSite2027
    steps:
      - name: Check out repository
        uses: actions/checkout@v7
      - name: Build Astro site
        uses: withastro/action@v6
        with:
          package-manager: pnpm@11.9.0

  deploy:
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    runs-on: ubuntu-latest
    needs: build
    steps:
      - name: Deploy to GitHub Pages
        id: deployment
        uses: actions/deploy-pages@v5
